<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Orch{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'organizer/img/orch-mark.svg' %}">
    <link rel="alternate icon" type="image/x-icon" href="{% static 'organizer/img/orch-mark.ico' %}">
    <link rel="shortcut icon" href="{% static 'organizer/img/orch-mark.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0F172A;
            --bg-mid: #1E293B;
            --text: #F8FAFC;
            --muted: #B8C2D8;
            --faint: rgba(248, 250, 252, 0.68);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-strong: rgba(255, 255, 255, 0.16);
            --stroke: rgba(255, 255, 255, 0.2);
            --stroke-soft: rgba(255, 255, 255, 0.12);
            --cyan: #22D3EE;
            --purple: #A855F7;
            --green: #4ADE80;
            --red: #FB7185;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            --ease: 200ms ease-out;
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(56, 189, 248, 0.25), transparent),
                radial-gradient(1000px 500px at 100% 110%, rgba(168, 85, 247, 0.25), transparent),
                linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 48%, var(--bg-deep) 100%);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.26;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at center, black, transparent 78%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.08;
            background-image:
                repeating-radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.55) 0 1px, transparent 1px 5px);
            mix-blend-mode: screen;
        }

        h1,
        h2,
        h3 {
            font-family: "Space Grotesk", "Inter", sans-serif;
            letter-spacing: 0;
            margin: 0;
        }

        p {
            color: var(--muted);
            margin: 0;
        }

        a {
            color: #67E8F9;
            text-decoration: none;
            transition: color var(--ease), opacity var(--ease);
        }

        a:hover {
            color: #C084FC;
        }

        .app-shell {
            position: relative;
            min-height: 100vh;
            padding: 32px;
            isolation: isolate;
        }

        .liquid-field {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            width: clamp(360px, 44vw, 720px);
            aspect-ratio: 1;
            border-radius: 38% 62% 60% 40% / 45% 42% 58% 55%;
            filter: blur(64px);
            opacity: 0.52;
            animation: liquidDrift 16s ease-in-out infinite alternate;
        }

        .blob-cyan {
            left: -180px;
            top: -120px;
            background: rgba(34, 211, 238, 0.5);
        }

        .blob-purple {
            right: -180px;
            bottom: -160px;
            background: rgba(168, 85, 247, 0.5);
            animation-delay: -5s;
        }

        .blob-blue {
            left: 40%;
            top: 34%;
            width: clamp(260px, 34vw, 560px);
            background: rgba(59, 130, 246, 0.24);
            animation-delay: -9s;
        }

        @keyframes liquidDrift {
            0% {
                transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
                border-radius: 38% 62% 60% 40% / 45% 42% 58% 55%;
            }
            50% {
                transform: translate3d(32px, -24px, 0) scale(1.1) rotate(18deg);
                border-radius: 56% 44% 42% 58% / 58% 40% 60% 42%;
            }
            100% {
                transform: translate3d(-24px, 36px, 0) scale(0.96) rotate(-10deg);
                border-radius: 44% 56% 52% 48% / 36% 60% 40% 64%;
            }
        }

        .topbar {
            position: sticky;
            top: 24px;
            z-index: 5;
            max-width: 1248px;
            margin: 0 auto 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--stroke);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            background: rgba(15, 23, 42, 0.72);
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.24), 0 8px 20px rgba(0, 0, 0, 0.22);
            flex: 0 0 auto;
            overflow: hidden;
        }

        .brand-mark img {
            width: 44px;
            height: 44px;
            display: block;
        }

        .brand-copy {
            min-width: 0;
        }

        .brand-copy h1 {
            font-size: clamp(1.08rem, 2vw, 1.38rem);
            line-height: 1.1;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-copy span {
            color: var(--faint);
            display: block;
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav a {
            color: rgba(248, 250, 252, 0.82);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
            transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease), transform var(--ease);
        }

        .nav a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.24);
            transform: translateY(-1px);
        }

        main {
            width: min(1248px, 100%);
            margin: 0 auto;
        }

        .page-stack {
            display: grid;
            gap: 24px;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.75fr) minmax(420px, 1.25fr);
            gap: 24px;
            align-items: stretch;
        }

        .page-banner {
            position: relative;
            overflow: hidden;
            min-height: 160px;
            display: grid;
            align-items: end;
            padding: clamp(24px, 4vw, 40px);
            border-radius: 16px;
            border: 1px solid var(--stroke);
            background:
                linear-gradient(120deg, rgba(15, 23, 42, 0.62), rgba(30, 41, 59, 0.42)),
                radial-gradient(circle at 78% 22%, rgba(34, 211, 238, 0.2), transparent 20rem),
                rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        .page-banner::before {
            content: "";
            position: absolute;
            inset: auto -8% -42% 44%;
            height: 260px;
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.32), rgba(168, 85, 247, 0.36));
            border-radius: 999px;
            filter: blur(28px);
            transform: rotate(-8deg);
        }

        .page-banner-content {
            position: relative;
            max-width: 720px;
            z-index: 1;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin-bottom: 12px;
            color: #A5F3FC;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--cyan);
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.72);
        }

        .page-banner h2 {
            font-size: clamp(1.9rem, 4vw, 3.2rem);
            line-height: 1;
            max-width: 16ch;
        }

        .page-banner p {
            max-width: 640px;
            margin-top: 16px;
            font-size: clamp(1rem, 2vw, 1.12rem);
        }

        .grid {
            display: grid;
            gap: 24px;
        }

        .grid-2 {
            grid-template-columns: minmax(0, 0.8fr) minmax(360px, 1.2fr);
            align-items: start;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 32px;
            transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease), background var(--ease);
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 34%);
            opacity: 0.45;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: rgba(103, 232, 249, 0.34);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34), 0 0 26px rgba(56, 189, 248, 0.18);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 1.34rem;
            line-height: 1.15;
            font-weight: 700;
        }

        .card-subtitle {
            color: var(--faint);
            margin-top: 6px;
            font-size: 0.92rem;
        }

        .button,
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            background: linear-gradient(90deg, #22D3EE, #A855F7);
            color: white;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(34, 211, 238, 0.18);
            padding: 10px 18px;
            font: 800 0.92rem/1 "Inter", sans-serif;
            cursor: pointer;
            transition: transform var(--ease), box-shadow var(--ease), filter var(--ease);
        }

        .button:hover,
        button:hover {
            color: white;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), 0 12px 28px rgba(168, 85, 247, 0.22);
            transform: translateY(-1px);
            filter: saturate(1.08);
        }

        .button svg,
        button svg {
            width: 18px;
            height: 18px;
        }

        .ghost-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--stroke);
            box-shadow: none;
        }

        .button-ghost {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--stroke);
            box-shadow: none;
        }

        table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid var(--stroke-soft);
            font-size: 0.9rem;
            vertical-align: top;
        }

        th {
            color: rgba(248, 250, 252, 0.64);
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.72rem;
        }

        td {
            color: rgba(248, 250, 252, 0.82);
            word-break: break-word;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .table-shell {
            overflow-x: auto;
            margin: 0 -4px;
            padding: 0 4px;
        }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(144px, 1fr));
            gap: 12px;
        }

        .stat {
            min-height: 112px;
            display: grid;
            align-content: space-between;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--stroke-soft);
            border-radius: 16px;
            padding: 16px;
            transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease);
        }

        .stat:hover {
            transform: translateY(-2px);
            border-color: rgba(103, 232, 249, 0.34);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .stat .value {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 0.92;
            font-weight: 700;
        }

        .stat .label {
            font-size: 0.78rem;
            color: var(--faint);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .stat-primary {
            background:
                linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(168, 85, 247, 0.16)),
                rgba(255, 255, 255, 0.1);
            border-color: rgba(103, 232, 249, 0.34);
        }

        input, select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--stroke);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 16px;
            font: 500 1rem/1.3 "Inter", sans-serif;
            width: 100%;
            outline: none;
            transition: border-color var(--ease), box-shadow var(--ease), background var(--ease);
        }

        input:focus,
        select:focus {
            border-color: rgba(103, 232, 249, 0.65);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12);
        }

        input::placeholder {
            color: rgba(248, 250, 252, 0.38);
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-size: 0.78rem;
            color: rgba(248, 250, 252, 0.76);
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            gap: 16px;
        }

        .form-two {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .help-text {
            font-size: 0.88rem;
            color: var(--faint);
        }

        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 20px;
            display: grid;
            gap: 10px;
        }

        .messages li {
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 0.92rem;
            border: 1px solid var(--stroke);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .messages .success {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(74, 222, 128, 0.32);
            color: #BBF7D0;
        }

        .messages .error {
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(251, 113, 133, 0.34);
            color: #FFE4E6;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #C4B5FD;
        }

        .badge-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .section-gap {
            height: 16px;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(248, 250, 252, 0.8);
            font-weight: 700;
        }

        .status-dot::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--green);
            box-shadow: 0 0 14px rgba(74, 222, 128, 0.6);
        }

        .status-dot.is-error::before {
            background: var(--red);
            box-shadow: 0 0 14px rgba(251, 113, 133, 0.58);
        }

        .empty-state {
            min-height: 220px;
            display: grid;
            place-items: center;
            gap: 14px;
            padding: 36px 24px;
            text-align: center;
            color: var(--faint);
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background:
                linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(168, 85, 247, 0.2)),
                rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.2);
            margin: 0 auto;
        }

        .empty-icon svg {
            width: 30px;
            height: 30px;
            color: #A5F3FC;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .empty-state p {
            max-width: 420px;
            margin: 0 auto;
        }

        .path-text {
            color: rgba(248, 250, 252, 0.64);
            font-size: 0.82rem;
        }

        @media (max-width: 820px) {
            .app-shell {
                padding: 16px;
            }

            .topbar {
                position: relative;
                top: 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .nav {
                width: 100%;
                justify-content: flex-start;
            }

            .grid-2,
            .overview-grid,
            .form-two {
                grid-template-columns: 1fr;
            }

            .page-banner {
                min-height: 148px;
            }
        }

        @media (max-width: 520px) {
            .brand-copy h1 {
                white-space: normal;
            }

            .nav a {
                flex: 1 1 auto;
                text-align: center;
            }

            .page-banner h2 {
                font-size: 2.15rem;
            }

            .card-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <div class="liquid-field" aria-hidden="true">
        <div class="blob blob-cyan"></div>
        <div class="blob blob-purple"></div>
        <div class="blob blob-blue"></div>
    </div>

    <header class="topbar">
        <a class="brand" href="{% url 'dashboard' %}" aria-label="Orch dashboard">
            <span class="brand-mark" aria-hidden="true">
                <img src="{% static 'organizer/img/orch-mark.svg' %}" alt="">
            </span>
            <span class="brand-copy">
                <h1>Orch</h1>
                <span>Smart sorting cockpit</span>
            </span>
        </a>
        <nav class="nav" aria-label="Primary navigation">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'profiles_list' %}">Profiles</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>

    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
