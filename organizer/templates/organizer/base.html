<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Iranzi File Organizer{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f1115;
            color: #e6e6e6;
            margin: 0;
            padding: 0;
        }
        header {
            background: #161a20;
            padding: 16px 24px;
            border-bottom: 1px solid #262b33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 18px;
            margin: 0;
        }
        header nav a {
            color: #9db4ff;
            text-decoration: none;
            margin-left: 16px;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 24px;
            max-width: 960px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #262b33;
            font-size: 14px;
        }
        th {
            color: #9aa4b2;
            font-weight: 600;
        }
        .card {
            background: #161a20;
            border: 1px solid #262b33;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        .stat-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .stat {
            background: #1b202a;
            border-radius: 6px;
            padding: 10px 16px;
            min-width: 120px;
        }
        .stat .value {
            font-size: 22px;
            font-weight: 700;
        }
        .stat .label {
            font-size: 12px;
            color: #9aa4b2;
        }
        input, select {
            background: #1b202a;
            border: 1px solid #2c333d;
            color: #e6e6e6;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        label {
            display: block;
            margin: 12px 0 4px;
            font-size: 13px;
            color: #9aa4b2;
        }
        button {
            background: #4c6ef5;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
        }
        button:hover {
            background: #3b5bdb;
        }
        .messages {
            list-style: none;
            padding: 0;
        }
        .messages li {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .messages .success {
            background: #14311f;
            border: 1px solid #1f5c37;
            color: #7fe0a1;
        }
        .messages .error {
            background: #331414;
            border: 1px solid #5c1f1f;
            color: #e07f7f;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            background: #1b202a;
            color: #9db4ff;
        }
    </style>
</head>
<body>
<header>
    <h1>Iranzi File Organizer</h1>
    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'config_edit' %}">Config</a>
        <a href="/admin/">Admin</a>
    </nav>
</header>
<main>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
