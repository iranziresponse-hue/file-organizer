services:
  - type: web
    name: orch-landing
    runtime: static
    plan: free
    rootDir: site
    buildCommand: echo "No build needed, plain static HTML/CSS"
    staticPublishPath: .
    previews:
      generation: off
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
