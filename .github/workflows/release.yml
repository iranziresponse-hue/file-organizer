name: Build and release Orch.exe

# Push a tag like v1.0.0 to build the exe and attach it to a new GitHub
# Release. workflow_dispatch lets you run the same build on demand (from
# the Actions tab) without cutting a release, useful for testing the build
# itself before tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        # Fails the build (and blocks the release) if any installed
        # dependency has a known CVE -- matches the release checklist a
        # user-facing exe deserves: don't ship a known-vulnerable library
        # just because the app code itself passed its tests.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run test suite
        run: python manage.py test

      - name: Build Orch.exe
        run: pyinstaller Orch.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Orch-windows
          path: dist\Orch.exe

      - name: Attach to release
        # Uploaded unzipped: the README and the landing page's download
        # button both point directly at .../releases/latest/download/Orch.exe,
        # and Orch.spec already builds one self-contained file -- an extra
        # zip step would only add an unzip step for the exact non-technical
        # users this is aimed at, for no real benefit.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\Orch.exe
          generate_release_notes: true
